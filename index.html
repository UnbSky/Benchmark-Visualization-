<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Benchmark Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=35" />
</head>
<body>
  <header class="top">
    <h1>Benchmark Atlas</h1>
    <div class="top-right">
      <div class="themes" role="group" aria-label="配色">
        <button type="button" class="theme-dot" data-theme-id="ink" title="黑色" aria-label="黑色"></button>
        <button type="button" class="theme-dot" data-theme-id="slate" title="蓝色" aria-label="蓝色"></button>
        <button type="button" class="theme-dot is-on" data-theme-id="paper" title="白色" aria-label="白色"></button>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab is-on" data-view="atlas">图谱</button>
        <button class="tab" data-view="chart">图表</button>
      </nav>
    </div>
  </header>

  <p class="howto" id="howto">图谱：悬停数据集看各模型分数与前三名；悬停模型看它在各数据集上的成绩。点数据集打开图表。</p>

  <section id="view-atlas" class="view is-on">
    <div class="stats" id="stats"></div>
    <div class="filters" id="hl-filters"></div>
    <p class="legend" aria-hidden="true">
      <span><i class="lg lg-cat"></i>类别</span>
      <span><i class="lg lg-bench"></i>数据集</span>
      <span><i class="lg lg-model"></i>模型</span>
    </p>
    <div class="atlas-box">
      <svg id="atlas" viewBox="0 0 960 560" preserveAspectRatio="xMinYMin meet" role="img" aria-label="图谱"></svg>
      <div id="tip" class="tip" hidden></div>
      <p class="zoom-hint">滚轮缩放 · 空白处拖动</p>
    </div>
  </section>

  <section id="view-chart" class="view">
    <div class="chart-modes" role="tablist" aria-label="图表模式">
      <button type="button" class="tab is-on" data-chart-mode="single">单数据集</button>
      <button type="button" class="tab" data-chart-mode="intersect">交集对比</button>
    </div>

    <div id="chart-single" class="chart-pane is-on">
      <div class="chart-filters" id="chart-filters"></div>
      <div id="chart-head"></div>
      <p class="axis-label" id="axis-label"></p>
      <svg id="bars" viewBox="0 0 960 320" role="img" aria-label="分数图"></svg>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>模型</th>
              <th>评估方式</th>
              <th class="col-metric">指标</th>
              <th>分数</th>
              <th>收集时间</th>
              <th>来源</th>
            </tr>
          </thead>
          <tbody id="score-body"></tbody>
        </table>
      </div>
    </div>

    <div id="chart-intersect" class="chart-pane">
      <div id="intersect-pick"></div>
      <div id="intersect-stats" class="intersect-stats"></div>
      <p class="axis-label" id="intersect-axis"></p>
      <svg id="intersect-bars" viewBox="0 0 960 320" role="img" aria-label="交集对比图"></svg>
      <div class="table-wrap" id="intersect-table-wrap">
        <table class="matrix">
          <thead id="intersect-head"></thead>
          <tbody id="intersect-body"></tbody>
        </table>
      </div>
    </div>
  </section>

  <button type="button" id="back-atlas" class="fab" hidden>返回图谱</button>

  <script src="data/benchmarks.js?v=35"></script>
  <script src="js/app.js?v=35"></script>
</body>
</html>
