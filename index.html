<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Benchmark Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=23" />
</head>
<body>
  <header class="top">
    <h1>Benchmark Atlas</h1>
    <nav class="tabs" role="tablist">
      <button class="tab is-on" data-view="atlas">图谱</button>
      <button class="tab" data-view="chart">图表</button>
    </nav>
  </header>

  <p class="howto">图谱：类别、数据集、模型在同一张图。默认不画数据集–模型连线；悬停或选中节点才显示对应连线。上方按领域或机构筛选，点模型可只看相关数据集。悬停数据集看说明并点进去打开图表。</p>

  <section id="view-atlas" class="view is-on">
    <div class="stats" id="stats"></div>
    <div class="filters" id="hl-filters"></div>
    <p class="legend" aria-hidden="true">
      <span><i class="lg lg-cat"></i>类别</span>
      <span><i class="lg lg-bench"></i>数据集</span>
      <span><i class="lg lg-model"></i>模型</span>
    </p>
    <div class="atlas-box">
      <svg id="atlas" viewBox="0 0 960 560" preserveAspectRatio="xMinYMin meet" role="img" aria-label="图谱"></svg>
      <div id="tip" class="tip" hidden></div>
      <p class="zoom-hint">滚轮缩放 · 空白处拖动</p>
    </div>
  </section>

  <section id="view-chart" class="view">
    <div class="chart-filters" id="chart-filters"></div>
    <div id="chart-head"></div>
    <p class="axis-label" id="axis-label"></p>
    <svg id="bars" viewBox="0 0 960 320" role="img" aria-label="分数图"></svg>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>模型</th>
            <th>评估方式</th>
            <th class="col-metric">指标</th>
            <th>分数</th>
            <th>收集时间</th>
            <th>来源</th>
          </tr>
        </thead>
        <tbody id="score-body"></tbody>
      </table>
    </div>
  </section>

  <script src="data/benchmarks.js?v=23"></script>
  <script src="js/app.js?v=23"></script>
</body>
</html>
